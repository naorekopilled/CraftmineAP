plugins {
	id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
}

base {
	archivesName = project.archives_base_name
}

def dumpFile = file("../apworld/craftmine/data/craftmine.json")

loom {
	runs {
		dump {
			server()
			name = "Data Dump"
			runDir = "run"
			vmArg "-Dcraftmineap.dump=${dumpFile}"
			programArgs "--nogui"
		}
		smoke {
			server()
			name = "Smoke Server"
			runDir = "run-smoke"
			vmArg "-Dcraftmineap.autoconnect=${findProperty('apAuto') ?: 'localhost:38281,Miner'}"
			programArgs "--nogui"
		}
	}
}

tasks.matching { it.name == "runSmoke" }.configureEach {
	standardInput = System.in
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	include implementation("io.github.archipelagomw:Java-Client:0.2.1") { transitive = false }
	include implementation("org.java-websocket:Java-WebSocket:1.6.0") { transitive = false }
	include implementation("org.apache.httpcomponents.core5:httpcore5:5.3.6")

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
